name: CASH PC Android
on:
  push:
    branches: [cash-pc/android-prototype]
    paths: ['cash-pc/**', '.github/workflows/cash-pc-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: cash-pc
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CASH-PC-Android-debug
          path: cash-pc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
