name: CASH PC - Winlator Android

on:
  push:
    branches:
      - cash-pc/winlator-integration
    paths:
      - '.github/workflows/cash-pc-winlator.yml'
      - 'cash-pc/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout CASH PC integration
        uses: actions/checkout@v4

      - name: Checkout Winlator and required submodules
        run: |
          git clone --branch v11.2.0 --recurse-submodules --depth 1 https://github.com/brunodev85/winlator.git upstream-winlator

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and native build toolchains
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Apply CASH PC app branding and native packaging fix
        working-directory: upstream-winlator/app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          strings = Path("app/src/main/res/values/strings.xml")
          content = strings.read_text(encoding="utf-8")
          original = '<string name="app_name">Winlator</string>'
          if content.count(original) != 1:
              raise SystemExit("Expected app_name string was not found exactly once")
          strings.write_text(content.replace(original, '<string name="app_name">CASH PC</string>', 1), encoding="utf-8")

          gradle = Path("app/build.gradle")
          build = gradle.read_text(encoding="utf-8")
          if "pickFirsts" not in build:
              insertion = """android {
              packagingOptions {
                  jniLibs {
                      pickFirsts += ['lib/arm64-v8a/libFLAC.so']
                  }
              }"""
              if "android {" not in build:
                  raise SystemExit("Could not locate Android Gradle configuration")
              build = build.replace("android {", insertion, 1)
              gradle.write_text(build, encoding="utf-8")
          PY

      - name: Build Android APK
        working-directory: upstream-winlator/app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CASH-PC-Winlator-Android-debug
          path: upstream-winlator/app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
