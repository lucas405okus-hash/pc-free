name: CASH PC - Winlator Android

on:
  push:
    branches:
      - cash-pc/winlator-integration
    paths:
      - '.github/workflows/cash-pc-winlator.yml'
      - 'cash-pc/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout CASH PC integration
        uses: actions/checkout@v4

      - name: Checkout Winlator and required submodules
        run: |
          git clone --branch v11.2.0 --recurse-submodules --depth 1 https://github.com/brunodev85/winlator.git upstream-winlator

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and native build toolchains
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Apply CASH PC app branding and native packaging fixes
        working-directory: upstream-winlator/app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          strings = Path("app/src/main/res/values/strings.xml")
          content = strings.read_text(encoding="utf-8")
          original = '<string name="app_name">Winlator</string>'
          branded = '<string name="app_name">CASH PC</string>'
          if branded not in content:
              if content.count(original) != 1:
                  raise SystemExit("Could not safely locate the application name")
              content = content.replace(original, branded, 1)
              strings.write_text(content, encoding="utf-8")

          gradle = Path("app/build.gradle")
          build = gradle.read_text(encoding="utf-8")
          libs = "['lib/arm64-v8a/libFLAC.so', 'lib/arm64-v8a/libfluidsynth-assetloader.so']"

          def find_block(text, pattern):
              match = re.search(pattern, text)
              if not match:
                  return None
              opening = text.find("{", match.start())
              depth = 0
              for pos in range(opening, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return opening, pos
              raise SystemExit("Unbalanced Gradle block: " + pattern)

          package = find_block(build, r"packagingOptions\s*\{")
          if package:
              p_open, p_close = package
              jni = find_block(build[p_open:p_close + 1], r"jniLibs\s*\{")
              if jni:
                  j_open, j_close = jni
                  absolute_close = p_open + j_close
                  if "libfluidsynth-assetloader.so" not in build:
                      build = build[:absolute_close] + "\n            pickFirsts += " + libs + "\n        " + build[absolute_close:]
              else:
                  if "libfluidsynth-assetloader.so" not in build:
                      build = build[:p_close] + "\n        jniLibs {\n            pickFirsts += " + libs + "\n        }\n    " + build[p_close:]
          else:
              android = find_block(build, r"android\s*\{")
              if not android:
                  raise SystemExit("Could not locate Android Gradle configuration")
              a_open, _ = android
              build = build[:a_open + 1] + "\n    packagingOptions {\n        jniLibs {\n            pickFirsts += " + libs + "\n        }\n    }" + build[a_open + 1:]

          gradle.write_text(build, encoding="utf-8")
          PY

      - name: Build Android APK
        working-directory: upstream-winlator/app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CASH-PC-Winlator-Android-debug
          path: upstream-winlator/app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
